<!-- Agrega la librería CryptoJS antes de tu script en el index.html -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; align-items:center; justify-content:center; z-index:9999;">
  <div style="background:white; padding:2rem; border-radius:8px; max-width:350px; width:100%; text-align:center;">
    <h2 style="margin-bottom:1rem; color:#0f172a;">Acceso a Prácticas</h2>
    <input type="text" id="userInput" placeholder="Usuario" style="width:100%; padding:0.6rem; margin-bottom:0.75rem; border:1px solid #ccc; border-radius:4px;">
    <input type="password" id="passInput" placeholder="Contraseña" style="width:100%; padding:0.6rem; margin-bottom:1rem; border:1px solid #ccc; border-radius:4px;">
    <button onclick="validarIngreso()" style="width:100%; padding:0.75rem; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Ingresar</button>
    <p id="loginError" style="color:red; font-size:0.85rem; margin-top:0.75rem; display:none;">Usuario o contraseña incorrectos.</p>
  </div>
</div>

<script>
  // Credenciales encriptadas (SHA-256)
  // Usuario predeterminado: docente | Clave predeterminada: mmo2026
  const USER_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
  const PASS_HASH = "d486d34b41b9d0b67482d8c3664d4b149b56f8749a9446d6b88b71d64388e622"; 

  function validarIngreso() {
    const u = document.getElementById('userInput').value;
    const p = document.getElementById('passInput').value;

    const uHash = CryptoJS.SHA256(u).toString();
    const pHash = CryptoJS.SHA256(p).toString();

    if (uHash === USER_HASH && pHash === PASS_HASH) {
      document.getElementById('loginOverlay').style.display = 'none';
      sessionStorage.setItem('autenticado', 'true');
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  // Verificar si ya ingresó en la sesión actual
  if (sessionStorage.getItem('autenticado') === 'true') {
    document.getElementById('loginOverlay').style.display = 'none';
  }
</script>
